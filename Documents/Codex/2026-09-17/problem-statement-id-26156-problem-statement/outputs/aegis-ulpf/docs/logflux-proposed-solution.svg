<svg xmlns="http://www.w3.org/2000/svg" width="1648" height="928" viewBox="0 0 1648 928">
<defs><linearGradient id="hero" x1="0" x2="1"><stop stop-color="#07172d"/><stop offset=".5" stop-color="#102d4f"/><stop offset="1" stop-color="#07172d"/></linearGradient><linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27d4ee"/><stop offset="1" stop-color="#315cf1"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#153047" flood-opacity=".17"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#2be5bb"/></marker></defs>
<rect width="1648" height="928" fill="#eef1f5"/><rect x="48" y="40" width="1552" height="848" rx="4" fill="#fff" filter="url(#shadow)"/>
<text x="824" y="96" text-anchor="middle" font-family="Arial,sans-serif" font-size="43" font-weight="900" letter-spacing="2" fill="#080b12">LOGFLUX — UNIVERSAL LOG PRE-PROCESSING</text><text x="1510" y="83" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="#3457ef">SIH · PS 26156</text>
<g font-family="Arial,sans-serif"><text x="91" y="190" font-size="29" font-weight="900" fill="#1453ad">PROPOSED SOLUTION:</text>
<g font-size="20" fill="#151e27"><circle cx="106" cy="239" r="12" fill="#16c6e2"/><path d="M100 239l5 5 9-11" fill="none" stroke="#fff" stroke-width="3"/><text x="137" y="232">Heterogeneous firewall, router and IDS logs arrive</text><text x="137" y="258">in different formats and lose meaning across tools.</text>
<circle cx="106" cy="308" r="12" fill="#16c6e2"/><path d="M100 308l5 5 9-11" fill="none" stroke="#fff" stroke-width="3"/><text x="137" y="301">LOGFLUX preserves the original bytes before parsing,</text><text x="137" y="327">then creates one traceable event representation.</text>
<circle cx="106" cy="377" r="12" fill="#16c6e2"/><path d="M100 377l5 5 9-11" fill="none" stroke="#fff" stroke-width="3"/><text x="137" y="370">Unknown formats enter a reviewed parser workflow</text><text x="137" y="396">instead of silently disappearing from operations.</text></g>
<text x="91" y="465" font-size="29" font-weight="900" fill="#1453ad">PROBLEMS SOLVED</text>
<g font-size="18" fill="#151e27"><circle cx="106" cy="512" r="12" fill="#16c6e2"/><path d="M100 512l5 5 9-11" fill="none" stroke="#fff" stroke-width="3"/><text x="137" y="506" font-weight="800">Lossless evidence chain — </text><text x="355" y="506">raw bytes, hash and receipt metadata remain linked.</text>
<circle cx="106" cy="566" r="12" fill="#16c6e2"/><path d="M100 566l5 5 9-11" fill="none" stroke="#fff" stroke-width="3"/><text x="137" y="560" font-weight="800">Parser drift — </text><text x="263" y="560">unknown structures become reviewable candidates.</text>
<circle cx="106" cy="620" r="12" fill="#16c6e2"/><path d="M100 620l5 5 9-11" fill="none" stroke="#fff" stroke-width="3"/><text x="137" y="614" font-weight="800">Untrusted mapping — </text><text x="329" y="614">bounded validation blocks unsafe fields.</text>
<circle cx="106" cy="674" r="12" fill="#16c6e2"/><path d="M100 674l5 5 9-11" fill="none" stroke="#fff" stroke-width="3"/><text x="137" y="668" font-weight="800">Investigation gaps — </text><text x="342" y="668">event, alert and case provenance stays connected.</text></g>
<text x="91" y="751" font-size="29" font-weight="900" fill="#1453ad">UNIQUE VALUE</text><g font-size="18" fill="#151e27"><circle cx="106" cy="797" r="11" fill="#21c83a"/><path d="M101 797l5 5 8-10" fill="none" stroke="#fff" stroke-width="3"/><text x="133" y="802" font-weight="800">Evidence-first normalization</text><circle cx="408" cy="797" r="11" fill="#21c83a"/><path d="M403 797l5 5 8-10" fill="none" stroke="#fff" stroke-width="3"/><text x="435" y="802" font-weight="800">Reviewed parser adaptation</text><circle cx="106" cy="842" r="11" fill="#21c83a"/><path d="M101 842l5 5 8-10" fill="none" stroke="#fff" stroke-width="3"/><text x="133" y="847" font-weight="800">Merkle proof + signed checkpoints</text></g></g>
<g transform="translate(850 170)"><rect width="690" height="585" rx="36" fill="url(#hero)" stroke="#173a64" stroke-width="3"/><text x="345" y="47" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#7fefff">FROM FRAGMENTED LOGS TO TRUSTED SIGNAL</text><path d="M30 100H660M30 490H660" stroke="#1d4c75" stroke-width="1"/>
<g transform="translate(44 160)"><rect width="176" height="235" rx="18" fill="#1d1839" stroke="#ff4866" stroke-width="2"/><text x="88" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="800" fill="#ff637a">UNTRUSTED INPUT</text><path d="M37 76h103v84H37zM53 96h70M53 119h52M53 142h31" fill="none" stroke="#ff6682" stroke-width="5"/><text x="88" y="197" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#f2b5c0">Syslog · JSON · CEF</text><text x="88" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#f2b5c0">Unknown · drifted</text></g>
<path d="M230 278h92" stroke="#ff6682" stroke-width="4" marker-end="url(#arrow)"/><g transform="translate(324 148)"><circle cx="85" cy="105" r="98" fill="#0e3158" stroke="#2be2f4" stroke-width="3"/><path d="M85 38l58 22v66c0 39-25 70-58 85-33-15-58-46-58-85V60z" fill="url(#shield)" opacity=".95"/><path d="M53 108l21 21 43-47" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="85" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="800" fill="#8ef7ff">LOGFLUX CORE</text><text x="85" y="264" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#9db9d3">preserve · normalize · verify</text></g>
<path d="M515 278h88" stroke="#29d8be" stroke-width="4" marker-end="url(#arrow)"/><g transform="translate(525 160)"><rect width="120" height="235" rx="18" fill="#103b3a" stroke="#2be5bb" stroke-width="2"/><text x="60" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="800" fill="#51f2c4">TRUSTED</text><circle cx="60" cy="104" r="42" fill="#0b6e59" stroke="#51f2c4" stroke-width="3"/><path d="M39 104l15 15 29-34" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/><text x="60" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#b4fff0">LOGFLUX schema</text><text x="60" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#b4fff0">Proof attached</text></g>
<g font-family="Arial,sans-serif"><rect x="44" y="430" width="184" height="48" rx="12" fill="#15385b"/><text x="136" y="460" text-anchor="middle" font-size="15" font-weight="700" fill="#8defff">RAW HASH</text><rect x="252" y="430" width="184" height="48" rx="12" fill="#15385b"/><text x="344" y="460" text-anchor="middle" font-size="15" font-weight="700" fill="#8defff">NORMALIZED</text><rect x="460" y="430" width="184" height="48" rx="12" fill="#15385b"/><text x="552" y="460" text-anchor="middle" font-size="15" font-weight="700" fill="#8defff">INVESTIGABLE</text></g></g>
<g transform="translate(850 790)"><text x="0" y="0" font-family="Arial,sans-serif" font-size="25" font-weight="900" fill="#1453ad">WHY IT STANDS OUT</text><g font-family="Arial,sans-serif" font-size="18" fill="#151e27"><circle cx="14" cy="48" r="11" fill="#21c83a"/><path d="M9 48l5 5 8-10" fill="none" stroke="#fff" stroke-width="3"/><text x="38" y="54" font-weight="800">Original bytes never disappear</text><circle cx="14" cy="92" r="11" fill="#21c83a"/><path d="M9 92l5 5 8-10" fill="none" stroke="#fff" stroke-width="3"/><text x="38" y="98" font-weight="800">Unknown formats become safe candidates</text><circle cx="14" cy="136" r="11" fill="#21c83a"/><path d="M9 136l5 5 8-10" fill="none" stroke="#fff" stroke-width="3"/><text x="38" y="142" font-weight="800">Every decision keeps its evidence trail</text></g></g>
<text x="824" y="870" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#58717d">LOGFLUX 1.0 · evidence-preserving telemetry for the next-generation SOC</text>
<rect x="840" y="760" width="710" height="130" fill="#fff"/><text x="850" y="785" font-family="Arial,sans-serif" font-size="25" font-weight="900" fill="#1453ad">WHY IT STANDS OUT</text><g font-family="Arial,sans-serif" font-size="17" fill="#151e27"><circle cx="864" cy="817" r="10" fill="#21c83a"/><path d="M859 817l5 5 8-10" fill="none" stroke="#fff" stroke-width="3"/><text x="888" y="823" font-weight="800">Original bytes never disappear</text><circle cx="864" cy="850" r="10" fill="#21c83a"/><path d="M859 850l5 5 8-10" fill="none" stroke="#fff" stroke-width="3"/><text x="888" y="856" font-weight="800">Unknown formats become safe candidates</text><circle cx="864" cy="883" r="10" fill="#21c83a"/><path d="M859 883l5 5 8-10" fill="none" stroke="#fff" stroke-width="3"/><text x="888" y="889" font-weight="800">Every decision keeps its evidence trail</text></g></svg>
